<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: #76565b;
  background: #f7e5e2;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 500px;
  min-height: 100dvh;
  margin: auto;
  padding: 15px 15px 110px;
  background: linear-gradient(180deg,#f8e5e4,#fff3e7);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.player {
  background: linear-gradient(145deg,#fff,#fff1e9);
  padding: 9px 13px;
  border-radius: 18px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-weight: 800;
  font-size: 13px;
}

.money {
  display: flex;
  gap: 7px;
}

.money-item {
  background: #fff;
  padding: 9px 11px;
  border-radius: 16px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-size: 13px;
  font-weight: 800;
}

.logo {
  text-align: center;
  margin: 20px 0 17px;
}

.logo h1 {
  font-family: Georgia,serif;
  font-size: 30px;
  color: #bc7381;
  margin: 0;
  text-shadow: 1px 2px #fff;
}

.logo p {
  color: #a98982;
  font-size: 12px;
  margin: 6px 0 0;
  letter-spacing: 1px;
}

.shop {
  position: relative;
  height: 375px;
  border: 6px solid #fff9ee;
  border-radius: 29px;
  overflow: hidden;
  background: linear-gradient(160deg,#f9d8d0,#f8e6ce 55%,#dce8d0);
  box-shadow: 0 8px 0 #e3c3b9, 0 13px 25px #b98c7b22;
}

.shop::before {
  content: "✿";
  position: absolute;
  left: 15px;
  top: 60px;
  color: #fff8e9;
  font-size: 50px;
  opacity: .6;
}

.shop::after {
  content: "✿";
  position: absolute;
  right: 10px;
  top: 95px;
  color: #fff8e9;
  font-size: 42px;
  opacity: .6;
}

.sign {
  position: absolute;
  z-index: 2;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: linear-gradient(#fffaf0,#fce7d8);
  border: 3px solid #e7b7a8;
  border-radius: 19px;
  padding: 10px 20px;
  color: #a66c71;
  font-family: Georgia,serif;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 4px 0 #d5a393;
}

.window {
  position: absolute;
  top: 83px;
  left: 7%;
  width: 86%;
  height: 185px;
  border: 8px solid #d9a58f;
  border-radius: 21px;
  background: linear-gradient(180deg,#fff9eb,#f9e7d8);
  box-shadow: inset 0 0 0 3px #fff;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}

.flower {
  font-size: 53px;
  filter: drop-shadow(0 5px 3px #9b756633);
  animation: sway 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: .5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes sway {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.shelf {
  position: absolute;
  top: 218px;
  left: 9%;
  width: 82%;
  height: 13px;
  background: #c58c77;
  border-radius: 8px;
}

.counter {
  position: absolute;
  bottom: 45px;
  left: 12%;
  width: 76%;
  height: 54px;
  background: linear-gradient(#d7a18b,#bb806f);
  border: 5px solid #f4d6bd;
  border-radius: 16px;
  box-shadow: 0 7px 0 #a96e63;
}

.counter::before {
  content: "🌷  💐  🌼  🌹";
  position: absolute;
  width: 100%;
  text-align: center;
  top: -38px;
  font-size: 26px;
}

.plant {
  position: absolute;
  left: 10px;
  bottom: 12px;
  font-size: 49px;
}

.cat {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 57px;
  filter: drop-shadow(0 4px 2px #795c4b44);
  animation: catmove 3s ease-in-out infinite;
}

@keyframes catmove {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.heart {
  position: absolute;
  right: 28px;
  top: 66px;
  font-size: 20px;
  animation: heart 2s infinite;
}

@keyframes heart {
  50% { transform: scale(1.3); }
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 22px 0;
}

.big-button {
  min-height: 66px;
  border-radius: 20px;
  background: linear-gradient(145deg,#fff,#fff0e9);
  color: #98666d;
  box-shadow: 0 6px 0 #e4c5bd, 0 8px 15px #b98c7b20;
  font-weight: 800;
  font-size: 14px;
  transition: .15s;
}

.big-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #e4c5bd;
}

.big-button span {
  font-size: 24px;
  display: block;
  margin-bottom: 3px;
}

.heading {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 21px;
  margin: 23px 0 12px;
}

.daily {
  background: linear-gradient(130deg,#fffaf0,#ffe9e3);
  border: 2px solid #fff;
  border-radius: 22px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 5px 0 #e9d0c5;
}

.gift {
  font-size: 40px;
}

.daily-info {
  flex: 1;
}

.daily-info b {
  font-size: 14px;
}

.daily-info p {
  font-size: 11px;
  color: #ad8b83;
  margin: 5px 0 0;
}

.claim {
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  border-radius: 14px;
  padding: 11px 13px;
  font-weight: 800;
  box-shadow: 0 4px 0 #c87583;
}

.claim:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #c87583;
}

.navigation {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #fffaf3;
  padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
  box-shadow: 0 -5px 20px #9e777522;
}

.nav-button {
  background: transparent;
  color: #a98a83;
  font-size: 11px;
  font-weight: bold;
  border-radius: 16px;
  padding: 7px 1px;
}

.nav-button span {
  display: block;
  font-size: 25px;
  margin-bottom: 4px;
}

.nav-button.active {
  color: #c46f80;
  background: #fbe6e5;
}

.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  display: none;
  width: max-content;
  max-width: 90%;
  background: #805c65;
  color: white;
  padding: 13px 18px;
  border-radius: 17px;
  font-size: 13px;
  text-align: center;
  box-shadow: 0 5px 15px #0002;
}

/* Игровые окна */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #65464c88;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 420px;
  max-height: 80dvh;
  overflow-y: auto;
  background: linear-gradient(145deg,#fffaf1,#fce7e4);
  border: 4px solid white;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 8px 25px #53343b44;
}

.modal-title {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 24px;
  text-align: center;
  margin-bottom: 15px;
}

.game-item {
  background: white;
  border-radius: 17px;
  padding: 14px;
  margin: 10px 0;
  box-shadow: 0 4px 0 #ead2c9;
}

.game-item p {
  font-size: 13px;
  color: #a7837e;
}

.game-action {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  font-weight: bold;
  border-radius: 14px;
  box-shadow: 0 4px 0 #c87583;
}

.close-modal {
  display: block;
  margin: 15px auto 0;
  padding: 10px 25px;
  border-radius: 14px;
  background: #f1ded7;
  color: #805c65;
  font-weight: bold;
}

/* Иллюстрированный главный экран — обновление оформления */
body{background:radial-gradient(circle at 20% 5%,#fff4e8,#f3d7da 55%,#e8c8ce);font-family:Trebuchet MS,-apple-system,Arial,sans-serif}
.app{max-width:520px;background:linear-gradient(180deg,#f8e1e6 0%,#fff0e5 45%,#f7e2d5 100%);box-shadow:0 0 50px #a86c7830;position:relative;overflow:hidden}
.app:before{content:"✿  ✧  ✿";position:absolute;top:72px;left:0;width:100%;text-align:center;font-size:32px;letter-spacing:75px;color:#e6b7bf80;pointer-events:none}

.logo{position:relative;z-index:1;margin:20px 0 14px}

/* Responsive mobile layout: preserve artwork proportions and gameplay */
html{width:100%;min-height:100%;overflow-x:hidden}
body{width:100%;min-height:100dvh;overflow-x:hidden}
.app{
  width:100%;max-width:520px;min-height:100dvh;
  margin-inline:auto;
  padding:clamp(9px,2.8vw,15px) clamp(9px,2.8vw,15px) calc(112px + env(safe-area-inset-bottom,0px));
  background-color:#f5dce3;
  background-image:url("./%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD.png");
  background-size:100% auto;
  background-position:center top;
  background-repeat:no-repeat;
}
.top{gap:clamp(3px,1.5vw,8px);min-width:0}
.player{font-size:clamp(10px,2.7vw,13px);padding:clamp(6px,1.7vw,9px);white-space:nowrap;flex-shrink:1}
.money{gap:clamp(3px,1.2vw,7px);min-width:0}
.money-item{font-size:clamp(10px,2.7vw,13px);padding:clamp(5px,1.7vw,9px);gap:3px;min-width:0}
.currency-icon{width:clamp(17px,5vw,24px);height:clamp(17px,5vw,24px)}
.logo{margin:clamp(14px,4vw,20px) 0 clamp(12px,3.5vw,17px)}
.logo h1{font-size:clamp(23px,7vw,36px);line-height:1.12}
.logo p{font-size:clamp(8px,2.1vw,11px);letter-spacing:clamp(0px,.2vw,1px)}
.shop{height:auto;aspect-ratio:1.17/1;min-height:0;overflow:visible}
.shop .cat[src]{
  width:clamp(60px,18vw,88px) !important;

  height:auto !important;
  right:39% !important;
  bottom:13% !important;

  transform:none !important;
}
.buttons{gap:clamp(7px,2.4vw,12px);margin:clamp(10px,3vw,20px) 0 12px}

.heading{font-size:clamp(17px,4.5vw,21px);margin:clamp(12px,3vw,18px) 0 10px}

.gift{font-size:clamp(28px,9vw,40px)}

.claim{padding:clamp(8px,2.5vw,11px);font-size:clamp(11px,3vw,14px);flex-shrink:0}

.nav-button{min-width:0;min-height:52px;font-size:clamp(9px,2.5vw,12px);padding:6px 1px}
.nav-button span{font-size:clamp(21px,6vw,27px)}
.modal{padding:12px}
.modal-card{max-width:min(420px,100%);max-height:calc(100dvh - 40px - env(safe-area-inset-bottom,0px))}

 height:auto !important;

/* App-like touch behavior: lock the scene, allow scrolling inside dialogs. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;touch-action:none}
.app{height:100dvh;min-height:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
.navigation{touch-action:manipulation}
button{touch-action:manipulation}
.modal{overscroll-behavior:contain;touch-action:none}
.modal-card{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}


/* Lock the main scene in place on touch devices (no page dragging/bounce). */
html,body{height:100%;height:100dvh;overflow:hidden !important;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;touch-action:none}
.app{height:100dvh;min-height:0 !important;overflow:hidden !important;overscroll-behavior:none;touch-action:none}
.app button,.navigation button{touch-action:manipulation}
.navigation{touch-action:none}
.modal{overscroll-behavior:contain;touch-action:none}
.modal-card{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}


/* Landscape guard: browser orientation cannot be forcibly locked. */

@media (orientation:landscape) and (pointer:coarse){#portraitGuard{display:flex}}

<script>
(function(){
  const splash=document.getElementById("betaFlowerSplash");
  const progress=document.getElementById("splashProgress");
  const caption=splash.querySelector(".splash-caption");
  const assets=[
    "./%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD.png",
    "./%D1%86%D0%B2%D0%B5%D1%82%D0%BE%D1%87%D0%BD%D0%B0%D1%8F%20%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F%20%D0%B3%D0%BB%D0%B0%D0%B2%20%D0%BC%D0%B5%D0%BD%D1%8E.png",
    "./%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png",
    "./%D0%B0%D0%BB%D0%BC%D0%B0%D0%B7.png",
    "./%D0%BD%D0%B0%D1%81%D1%82%D1%80%D0%BE%D0%B9%D0%BA%D0%B8.png",
    "./%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA.png",
    "./cat.png",
    "./oblako_1_s_cvetami.png",
    "./oblako_2.png",
    "./oblako_3.png",
    "./oblako_4.png",
    "./oblako_5_s_cvetami.png"
  ];
  const retry=document.createElement("button");
  retry.type="button";retry.textContent="Повторить загрузку";
  retry.style.cssText="display:none;margin:16px auto 0;padding:12px 22px;border:2px solid white;border-radius:16px;background:#edb5c5;color:#7d4c61;font-weight:700;box-shadow:0 4px 0 #d49bab";
  splash.querySelector(".splash-inner").appendChild(retry);
  const ready=new Set();
  const splashStarted=performance.now();
  const minimumSplashMs=2800;
  let running=false;
  function loadImage(src){
    return new Promise(resolve=>{
      const img=new Image();
      let done=false;
      const timer=setTimeout(()=>finish(false),12000);
      function finish(ok){if(done)return;done=true;clearTimeout(timer);img.onload=null;img.onerror=null;resolve(ok);}
      img.onload=()=>finish(img.naturalWidth>0);
      img.onerror=()=>finish(false);
      img.src=src;
      if(img.complete&&img.naturalWidth>0)finish(true);
    });
  }
  async function load(){
    if(running)return;
    running=true;retry.style.display="none";
    caption.textContent="Загружаем цветочную лавку...";
    const missing=assets.filter(src=>!ready.has(src));
    await Promise.all(missing.map(async src=>{
      // Retry transient failures; do not treat an image error as success.
      for(let attempt=0;attempt<3;attempt++){
        if(await loadImage(src)){ready.add(src);break;}
        if(attempt<2)await new Promise(resolve=>setTimeout(resolve,650*(attempt+1)));
      }
      progress.style.width=Math.round(ready.size/assets.length*100)+"%";
    }));
    running=false;
    if(ready.size!==assets.length){
      caption.textContent="Не все изображения загрузились. Проверь подключение к интернету.";
      retry.style.display="block";
      return;
    }
    caption.textContent="Всё готово!";
    progress.style.width="100%";
    // Loading a PNG is not the same as having its pixels decoded and painted.
    // Decode the actual main-screen images before removing the splash.
    const critical=assets.slice(0,7);
    await Promise.all(critical.map(async src=>{
      const img=new Image();img.src=src;
      try{if(img.decode)await img.decode();}catch(e){}
    }));
    const remaining=Math.max(0,minimumSplashMs-(performance.now()-splashStarted));
    if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    splash.classList.add("splash-dispersing");
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches||localStorage.getItem("betaFlowerReduceMotion")==="1";
    setTimeout(()=>{
      splash.classList.add("splash-hidden");
      setTimeout(()=>splash.remove(),reduced?100:650);
    },reduced?0:1550);
  }
  retry.addEventListener("click",load);
  // The existing loading screen and its timing remain unchanged.
  // Browser autoplay policies may prevent the short studio chime on iOS.
  function agdgChime(){
    try{
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if(!AudioContextClass)return;
      const ctx=new AudioContextClass();
      if(ctx.state==="suspended")ctx.resume().catch(()=>{});
      const start=ctx.currentTime+.08;
      [523.25,659.25,783.99].forEach((freq,i)=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type="sine";osc.frequency.value=freq;
        const t=start+i*.17;
        gain.gain.setValueAtTime(.0001,t);
        gain.gain.exponentialRampToValueAtTime(.065,t+.035);
        gain.gain.exponentialRampToValueAtTime(.0001,t+1.1);
        osc.connect(gain);gain.connect(ctx.destination);
        osc.start(t);osc.stop(t+1.13);
      });
      setTimeout(()=>ctx.close().catch(()=>{}),2100);
    }catch(e){}
  }
  const studioIntro=document.getElementById("agdgIntro");
  agdgChime();
  // Fade in .85s, hold for 3.5s, fade out 1s, then reveal original loader.
  setTimeout(()=>studioIntro.classList.add("agdg-out"),4350);
  setTimeout(()=>{studioIntro.remove();load();},5350);
})();
let coins = Number(localStorage.getItem("betaFlowerCoins")) || 250;
const ENERGY_MAX=100, ENERGY_REGEN_MS=5*60*1000, ENERGY_GAME_COST=5;
let energy=Number(localStorage.getItem("betaFlowerEnergy"));
if(!Number.isFinite(energy))energy=ENERGY_MAX;
if(localStorage.getItem("betaFlowerEnergyCapacityMigrated")!=="1"){energy=Math.min(ENERGY_MAX,energy+70);localStorage.setItem("betaFlowerEnergyCapacityMigrated","1");}
energy=Math.max(0,Math.min(ENERGY_MAX,Math.floor(energy)));
let energyTimestamp=Number(localStorage.getItem("betaFlowerEnergyTimestamp"))||Date.now();
function saveEnergy(){localStorage.setItem("betaFlowerEnergy",String(energy));localStorage.setItem("betaFlowerEnergyTimestamp",String(energyTimestamp));}
function refreshEnergy(){
  const now=Date.now();
  if(energy>=ENERGY_MAX){energy=ENERGY_MAX;energyTimestamp=now;}
  else if(now>energyTimestamp){const gained=Math.floor((now-energyTimestamp)/ENERGY_REGEN_MS);if(gained){energy=Math.min(ENERGY_MAX,energy+gained);energyTimestamp=energy>=ENERGY_MAX?now:energyTimestamp+gained*ENERGY_REGEN_MS;}}
  saveEnergy();
  const value=document.getElementById("energyValue"),timer=document.getElementById("energyTimer");
  if(value)value.textContent=energy+"/"+ENERGY_MAX;
  
}
function spendEnergy(amount=ENERGY_GAME_COST){refreshEnergy();if(energy<amount){message("Недостаточно энергии! Подожди восстановления.");return false;}energy-=amount;energyTimestamp=energy===ENERGY_MAX-amount?Date.now():energyTimestamp;refreshEnergy();return true;}
function showEnergyInfo(){refreshEnergy();message("ENERGY_ICON "+energy+"/"+ENERGY_MAX+" · +1 энергия каждые 5 минут · генератор: −1 · мини-игра: −5");}
refreshEnergy();setInterval(refreshEnergy,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshEnergy();});
let today = new Date().toDateString();
let giftTaken = localStorage.getItem("betaFlowerGiftTaken") === today;

let decorations = JSON.parse(
  localStorage.getItem("betaFlowerDecorations") || "[]"
);

let bouquetCount = Number(
  localStorage.getItem("betaFlowerBouquets") || 0
);

document.getElementById("coins").textContent = coins;

function message(text) {
  let toast = document.getElementById("toast");
  toast.replaceChildren();
  String(text).split("ENERGY_ICON").forEach((part,i)=>{
    if(i){const icon=document.createElement("img");icon.src="./energy2.png";icon.alt="Энергия";icon.className="energy-png";toast.appendChild(icon);}
    toast.appendChild(document.createTextNode(part));
  });
  toast.style.display = "block";

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 2300);
}

function tab(button, name) {
  document.querySelectorAll(".nav-button").forEach(item => {
    item.classList.remove("active");
  });

  button.classList.add("active");

  const pages = {
    "Лавка": null,
    "Мастерская": "merge",
    "Город": "city",
    "Мини-игры": "games",
    "Украшения": "decorations"
  };

  if(name!=="Город")closeCity();
  if(name!=="Мастерская")closeMerge();
  if(name==="Город"){closePanel();openCity();return;}
  if (pages[name] === null) {
    closePanel();
  } else {
    openPanel(pages[name]);
  }
}

function localDateKey(date) {
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");

function ensureMusicAudio(){
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return false;
  if(!gameAudioContext)gameAudioContext=new Context();
  if(!musicGain){
    musicGain=gameAudioContext.createGain();

  }
  return true;

function musicNote(freq,start,duration,level){
  const ctx=gameAudioContext;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type="sine";osc.frequency.setValueAtTime(freq,start);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level),start+.06);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  osc.connect(gain);gain.connect(musicGain);
  osc.start(start);osc.stop(start+duration+.02);
}
function scheduleMusic(){
  if(!gameMusicEnabled||!gameSoundEnabled||document.hidden||!gameAudioContext||gameAudioContext.state!=="running")return;
  const ctx=gameAudioContext;
  const beat=.46;
  while(musicNextTime<ctx.currentTime+.6){
    const index=musicStep%musicMelody.length;
    const start=musicNextTime;
    musicNote(musicMelody[index],start,.37,.34);
    if(index%8===0){
      const chord=musicChords[Math.floor(index/8)%musicChords.length];
      chord.forEach((freq,i)=>musicNote(freq/2,start,3.2,.07/(i+1)));
    }
    musicNextTime+=beat;
    musicStep++;
  }
}
function updateMusic(){
  const shouldPlay=gameMusicEnabled&&gameSoundEnabled&&gameVolume>0&&!document.hidden;
  if(!shouldPlay){
    if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null;}
    if(musicGain&&gameAudioContext)musicGain.gain.setTargetAtTime(0,gameAudioContext.currentTime,.08);
    return;
  }
  if(!ensureMusicAudio())return;
  if(gameAudioContext.state==="suspended")gameAudioContext.resume().catch(()=>{});
  musicGain.gain.setTargetAtTime((gameVolume/100)*.13,gameAudioContext.currentTime,.2);
  if(musicTimer===null){
    musicNextTime=gameAudioContext.currentTime+.08;
    musicTimer=setInterval(scheduleMusic,180);

  }

function mergeTap(index){

 if(target&&target.g!==undefined){mergeUseGenerator(index);return;}
 if(selected===index){mergeState.selected=-1;drawMerge();return;}

 if(from.g!==undefined){if(!target){board[index]=from;board[selected]=null;mergeSave();}mergeState.selected=-1;drawMerge();return;}
 if(target&&target.g===undefined&&target.c===from.c&&target.l===from.l&&target.l<8){
   board[index]={c:target.c,l:target.l+1};board[selected]=null;
   mergeState.selected=-1;mergeSave();drawMerge();return;
 }
 if(!target){board[index]=from;board[selected]=null;mergeState.selected=-1;mergeSave();drawMerge();return;}

const flowerIcons=[
  ["🌷","02_тюльпан.png"],["🌼","04_ромашка.png"],["🌸","03_сакура.png"],

];
const flowers=flowerIcons.map((entry,i)=>'<img class="flower-icon" src="./'+encodeURIComponent(entry[1])+'" alt="'+entry[0]+'" draggable="false">');
function matchRuns(board){
  const found=new Set();
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){
    const p=r*6+c,v=board[p];
    if(c<4&&v===board[p+1]&&v===board[p+2]){let j=c;while(j<6&&board[r*6+j]===v)found.add(r*6+j++);}
    if(r<4&&v===board[p+6]&&v===board[p+12]){let j=r;while(j<6&&board[j*6+c]===v)found.add(j++*6+c);}
  }
  return [...found];
}
function freshBoard(){
  const b=[];
  for(let i=0;i<36;i++){
    let choices=[0,1,2,3,4,5];
    if(i%6>=2)choices=choices.filter(v=>!(b[i-1]===v&&b[i-2]===v));
    if(i>=12)choices=choices.filter(v=>!(b[i-6]===v&&b[i-12]===v));
    b.push(choices[Math.floor(Math.random()*choices.length)]);
  }
  return b;
}

function drawMatch3(){

  const g=arcade;
  arcadeView('<div class="modal-title">🌷 Три в ряд</div><p class="arcade-info">Очки: '+g.score+' · Ходы: '+g.moves+'</p><div class="match-grid">'+g.board.map((v,i)=>'<button class="match-tile '+(i===g.selected?'selected':'')+'" onclick="tapMatch('+i+')" aria-label="Цветок '+(i+1)+'">'+flowers[v]+'</button>').join('')+'</div><p class="arcade-hint">Перетаскивай цветки на соседнюю клетку или выбирай два нажатием.</p><button class="game-action" onclick="arcadeBack()">К мини-играм</button>');
}
const matchPause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function matchTiles(){return [...document.querySelectorAll(".match-grid .match-tile")];}
async function animateMatchSwap(i,j){
  const tiles=matchTiles(),first=tiles[i],second=tiles[j];
  if(!first||!second)return;
  const r1=first.getBoundingClientRect(),r2=second.getBoundingClientRect();
  const dx=r2.left-r1.left,dy=r2.top-r1.top;
  if(localStorage.getItem("betaFlowerReduceMotion")==="1")return;
  first.style.zIndex="3";second.style.zIndex="3";
  first.style.transition=second.style.transition="transform 240ms cubic-bezier(.2,.8,.2,1)";
  first.style.transform="translate("+dx+"px,"+dy+"px)";
  second.style.transform="translate("+(-dx)+"px,"+(-dy)+"px)";
  await matchPause(260);
}
function matchSparkles(indices){
  if(localStorage.getItem("betaFlowerReduceMotion")==="1")return;
  const tiles=matchTiles();
  const layer=document.createElement("div");
  layer.className="match-sparkle-layer";
  document.body.appendChild(layer);
  const symbols=["✦","✧","❀","✿"];
  indices.forEach((index)=>{
    const tile=tiles[index];if(!tile)return;
    const rect=tile.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    for(let k=0;k<5;k++){
      const particle=document.createElement("span");
      particle.className="match-sparkle";
      particle.textContent=symbols[(index+k)%symbols.length];
      particle.style.left=cx+"px";particle.style.top=cy+"px";
      const angle=(Math.PI*2*k/5)+(index%3)*.35;
      const distance=22+Math.random()*28;
      particle.style.setProperty("--spark-x",Math.cos(angle)*distance+"px");
      particle.style.setProperty("--spark-y",Math.sin(angle)*distance-12+"px");
      particle.style.animationDelay=(k*35)+"ms";
      layer.appendChild(particle);
    }
  });
  setTimeout(()=>layer.remove(),900);
}
async function animateMatchRemoval(indices){
  matchSparkles(indices);
  const tiles=matchTiles();
  if(localStorage.getItem("betaFlowerReduceMotion")==="1")return;
  indices.forEach(i=>{
    const el=tiles[i];if(!el)return;
    el.style.transition="transform 220ms ease-in, opacity 220ms ease-in";
    el.style.transform="scale(.15) rotate(25deg)";
    el.style.opacity="0";
  });
  await matchPause(240);
}
async function animateMatchFall(boardBefore,removed,g){
  const marked=new Set(removed),incoming=Array(36).fill(null);
  const next=Array(36);
  for(let c=0;c<6;c++){
    const kept=[];
    for(let r=5;r>=0;r--)if(!marked.has(r*6+c))kept.push({value:boardBefore[r*6+c],from:r});
    const missing=6-kept.length;
    for(let k=0;k<missing;k++)kept.push({value:Math.floor(Math.random()*flowers.length),from:-1-(k)});
    for(let r=5;r>=0;r--){
      const item=kept[5-r],p=r*6+c;
      next[p]=item.value;
      incoming[p]=item.from<0?r+missing+1:r-item.from;
    }
  }
  g.board=next;
  drawMatch3();
  if(localStorage.getItem("betaFlowerReduceMotion")==="1")return;
  const tiles=matchTiles();
  tiles.forEach((el,i)=>{
    const rows=incoming[i];
    if(rows<=0)return;
    const step=el.getBoundingClientRect().height+5;
    el.animate([{transform:"translateY("+(-rows*step)+"px)",opacity:rows>1?.45:1},{transform:"translateY(5px)",opacity:1,offset:.85},{transform:"translateY(0)",opacity:1}],{duration:330+Math.min(rows,6)*55,delay:(i%6)*25,easing:"cubic-bezier(.22,.75,.3,1)",fill:"both"});
  });
  await matchPause(720);
}
async function tapMatch(i){
  const g=arcade;
  if(!g||g.type!=="match"||g.busy||g.moves<=0)return;
  if(g.selected<0){g.selected=i;drawMatch3();return;}
  const j=g.selected;g.selected=-1;
  if(i===j){drawMatch3();return;}
  if(Math.abs(Math.floor(i/6)-Math.floor(j/6))+Math.abs(i%6-j%6)!==1){g.selected=i;drawMatch3();return;}
  g.busy=true;
  await animateMatchSwap(i,j);
  if(arcade!==g)return;
  [g.board[i],g.board[j]]=[g.board[j],g.board[i]];
  let removed=matchRuns(g.board);
  if(!removed.length){
    drawMatch3();
    await animateMatchSwap(i,j);
    if(arcade!==g)return;
    [g.board[i],g.board[j]]=[g.board[j],g.board[i]];
    g.busy=false;drawMatch3();return;
  }
  g.moves--;
  drawMatch3();
  let chain=0;
  while(removed.length&&chain<12){
    await animateMatchRemoval(removed);
    if(arcade!==g)return;
    g.score+=removed.length*10;
    await animateMatchFall(g.board.slice(),removed,g);
    if(arcade!==g)return;
    removed=matchRuns(g.board);chain++;
  }
  g.busy=false;
  if(g.moves===0){
    const reward=Math.min(3,Math.max(1,Math.floor(g.score/220)));
    arcadeReward(reward);
    arcadeView('<div class="modal-title">Игра окончена!</div><p class="arcade-info">Очки: '+g.score+' · Получено монет: '+reward+'</p><button class="game-action" onclick="startMatch3()">Ещё раз</button><button class="game-action" onclick="arcadeBack()">К мини-играм</button>');
    return;
  }
  drawMatch3();
}

  arcadeView('<div class="modal-title">🦋 Найди пару</div><p class="arcade-info">Пары: '+(g.matched.length/2)+'/6 · Попытки: '+g.attempts+'</p><div class="memory-grid">'+g.cards.map((v,i)=>'<button class="memory-tile" onclick="tapMemory('+i+')" aria-label="Карточка '+(i+1)+'">'+(g.opened.includes(i)||g.matched.includes(i)?flowers[v]:'❀')+'</button>').join('')+'</div><button class="game-action" onclick="arcadeBack()">К мини-играм</button>');

function tapMemory(i){
  const g=arcade;if(!g||g.type!=="memory"||g.busy||g.opened.includes(i)||g.matched.includes(i))return;
  g.opened.push(i);

    if(g.cards[g.opened[0]]===g.cards[g.opened[1]]){
      g.matched.push(...g.opened);g.opened=[];
      if(g.matched.length===12){
        const reward=Math.max(1,Math.min(3,4-Math.floor(g.attempts/5)));arcadeReward(reward);
        arcadeView('<div class="modal-title">Все пары найдены!</div><p class="arcade-info">Попытки: '+g.attempts+' · Награда: '+reward+' монет</p><button class="game-action" onclick="startMemory()">Ещё раз</button><button class="game-action" onclick="arcadeBack()">К мини-играм</button>');return;
      }
    }else{
      g.busy=true;
      setTimeout(()=>{if(arcade!==g)return;g.opened=[];g.busy=false;drawMemory();},850);
    }
  }
  drawMemory();
}
function startCatch(){
  if(!spendEnergy())return;
  arcadeStop();
  arcade={type:"catch",score:0,seconds:30,basket:.5,items:[],spawn:0,last:0,elapsed:0,frame:0,active:true};

  const field=document.getElementById("betaFlowerRain"),g=arcade;

    if(arcade!==g||!g.active)return;

  field.addEventListener("pointermove",move);

}
function tickCatch(time){
  const g=arcade;
  if(!g||g.type!=="catch"||!g.active)return;
  if(!g.last)g.last=time;
  const dt=Math.min(.05,(time-g.last)/1000);
  g.last=time;g.elapsed+=dt;
  g.seconds=Math.max(0,30-g.elapsed);
  const field=document.getElementById("betaFlowerRain");
  if(!field)return;
  if(g.seconds<=0){
    g.active=false;
    const reward=Math.max(2,Math.min(4,Math.floor(g.score/15)));
    arcadeReward(reward);
    arcadeView('<div class="modal-title">Цветочный дождь завершён!</div><p class="arcade-info">Очки: '+g.score+' · Награда: '+reward+' монет</p><button class="game-action" onclick="startCatch()">Ещё раз</button><button class="game-action" onclick="arcadeBack()">К мини-играм</button>');
    return;
  }
  const difficulty=1+g.elapsed/28;
  g.spawn+=dt;
  if(g.spawn>Math.max(.31,.83-g.elapsed*.014)){
    g.spawn=0;
    const roll=Math.random(),kind=roll<.12?"gold":roll<.27?"butterfly":"flower";
    const el=document.createElement("div");
    el.className="rain-item rain-"+kind;
    if(kind==="flower")el.innerHTML=flowers[[0,1,2,3,4,5][Math.floor(Math.random()*6)]];
    else el.textContent=kind==="gold"?"🌟":"🦋";
    field.appendChild(el);
    g.items.push({x:.07+Math.random()*.86,y:-.12,speed:(.24+Math.random()*.12)*difficulty,kind,el});
  }
  const basket=document.getElementById("rainBasket");
  const basketY=.87;
  g.items=g.items.filter(item=>{
    item.y+=item.speed*dt;
    item.el.style.left=(item.x*100)+"%";
    item.el.style.top=(item.y*100)+"%";
    if(item.y>=basketY&&item.y<basketY+.075&&Math.abs(item.x-g.basket)<.115){
      g.score+=item.kind==="gold"?5:item.kind==="butterfly"?-2:1;
      g.score=Math.max(0,g.score);
      item.el.remove();
      basket.classList.remove("rain-caught");void basket.offsetWidth;basket.classList.add("rain-caught");
      return false;
    }
    if(item.y>1.1){item.el.remove();return false;}
    return true;
  });
  document.getElementById("rainScore").textContent="Очки: "+g.score+" · Время: "+Math.ceil(g.seconds)+" сек";
  g.frame=requestAnimationFrame(tickCatch);
}

 flowerDrag=null;
}
document.addEventListener("pointerdown",e=>{
 if(e.button!==0||flowerDrag)return;
 const source=e.target.closest(".merge-board .merge-cell,.match-grid .match-tile");
 if(!source)return;
 const type=source.classList.contains("merge-cell")?"merge":"match";
 const index=Array.prototype.indexOf.call(source.parentElement.children,source);
 if(index<0)return;
 if(type==="merge"&&!mergeState.board[index])return;
 if(type==="match"&&(!arcade||arcade.type!=="match"||arcade.busy||arcade.moves<=0))return;
 flowerDrag={type,index,source,x:e.clientX,y:e.clientY,moved:false,ghost:null};
},{passive:true});
document.addEventListener("pointermove",e=>{
 const d=flowerDrag;if(!d)return;
 const dx=e.clientX-d.x,dy=e.clientY-d.y;
 if(!d.moved&&Math.hypot(dx,dy)<9)return;
 if(!d.moved){
   d.moved=true;
   const ghost=d.source.cloneNode(true);
   ghost.removeAttribute("onclick");
   ghost.classList.add("flower-drag-ghost");
   const rect=d.source.getBoundingClientRect();
   ghost.style.width=rect.width+"px";ghost.style.height=rect.height+"px";
   document.body.appendChild(ghost);d.ghost=ghost;
   d.source.classList.add("flower-drag-source");
 }
 d.ghost.style.left=e.clientX+"px";d.ghost.style.top=e.clientY+"px";
 if(e.cancelable)e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",e=>{
 const d=flowerDrag;if(!d)return;
 const target=d.moved?flowerDragCellAt(e.clientX,e.clientY,d.type):-1;
 const moved=d.moved;
 flowerDragClear();
 if(!moved)return;
 flowerSuppressClickUntil=Date.now()+500;
 if(target<0||target===d.index)return;
 if(d.type==="merge"){
   const from=mergeState.board[d.index],to=mergeState.board[target];
   if(from&&from.g!==undefined){
     if(!to){mergeState.board[target]=from;mergeState.board[d.index]=null;mergeState.selected=-1;mergeSave();drawMerge();}
   }else if(to&&to.g!==undefined){
     if(from){mergeState.board[target]=from;mergeState.board[d.index]=to;mergeState.selected=-1;mergeSave();drawMerge();}
   }else{mergeState.selected=d.index;mergeTap(target);}
 }else{
   const adjacent=Math.abs(Math.floor(target/6)-Math.floor(d.index/6))+Math.abs(target%6-d.index%6)===1;
   if(adjacent&&arcade&&arcade.type==="match"&&!arcade.busy){
     arcade.selected=d.index;
     tapMatch(target);
   }
 }
},{passive:true});
document.addEventListener("pointercancel",flowerDragClear,{passive:true});
document.addEventListener("click",e=>{
 if(Date.now()>flowerSuppressClickUntil)return;
 if(e.target.closest(".merge-board .merge-cell,.match-grid .match-tile")){
   e.preventDefault();e.stopImmediatePropagation();
 }
},true);


/* Independent beta city: saved separately from the main game. */
const CITY_TYPES=[
 {name:"Домик",icon:"🏡",price:80,income:0},
 {name:"Цветочный магазин",icon:"🏬",price:150,income:0},
 {name:"Парк",icon:"🌳",price:100,income:0},
 {name:"Кафе",icon:"☕",price:200,income:0},
 {name:"Фонтан",icon:"⛲",price:120,income:0},
 {name:"Оранжерея",icon:"🌺",price:250,income:0}
];
const CITY_PLOTS=[0,1,3,4,5,7,8,9,10,12,13,14,16,17,27,28,30,31,32,34,35,36,37,39,40,41,43,44,63,64,66,67,68,70,71,72,73,75,76,77,79,80];
let cityData={};try{const saved=JSON.parse(localStorage.getItem("betaFlowerCity")||"{}");if(saved&&typeof saved==="object"&&!Array.isArray(saved))cityData=saved;}catch(e){}
let citySelected=null;
function citySave(){localStorage.setItem("betaFlowerCity",JSON.stringify(cityData));}
function openCity(){document.getElementById("cityScreen").classList.add("show");document.getElementById("cityScreen").setAttribute("aria-hidden","false");drawCity();}
function closeCity(){const el=document.getElementById("cityScreen");if(!el)return;el.classList.remove("show");el.setAttribute("aria-hidden","true");}
function cityChoose(i){citySelected=i;drawCity();}
function cityBuild(type){
 if(citySelected===null||!CITY_PLOTS.includes(citySelected)||cityData[citySelected])return;
 const building=CITY_TYPES[type];if(!building||coins<building.price){message("Недостаточно монет");return;}
 coins-=building.price;updateCoins();cityData[citySelected]={type,level:1};citySave();drawCity();
}
function cityUpgrade(){
 const item=cityData[citySelected];if(!item)return;
 const cost=100*item.level;
 if(item.level>=5)return;
 if(coins<cost){message("Недостаточно монет");return;}
 coins-=cost;updateCoins();item.level++;citySave();drawCity();
}
function drawCity(){
 const map=document.getElementById("cityMap");if(!map)return;
 document.getElementById("cityMoney").textContent="🪙 "+coins;
 let html="";
 for(let i=0;i<81;i++){
  const r=Math.floor(i/9),c=i%9,road=r===2||r===6||c===2||c===6;
  if(road){const kind=(r===2||r===6)&&(c===2||c===6)?"cross":r===2||r===6?"h":"v";html+='<div class="city-tile road '+kind+'"></div>';continue;}
  const plot=CITY_PLOTS.includes(i),building=cityData[i],type=building&&CITY_TYPES[building.type];
  html+='<button class="city-tile '+(plot?"plot":"")+(citySelected===i?" selected":"")+'" '+(plot?'onclick="cityChoose('+i+')"':'disabled')+' aria-label="'+(type?type.name:"Участок")+'">'+(type?type.icon:plot?"＋":(i%7===0?"🌲":"🌿"))+(building?'<small>'+building.level+'</small>':"")+'</button>';
 }
 map.innerHTML=html;
 const panel=document.getElementById("cityPanel"),count=Object.keys(cityData).length;
 if(citySelected===null||!CITY_PLOTS.includes(citySelected)){panel.innerHTML='<h3>Мой город · '+count+' зданий</h3><p>Выбирай свободные участки на карте, строй дома, магазины и парки. Дороги уже проложены. Здания можно улучшать до 5-го уровня.</p>';return;}
 const item=cityData[citySelected];
 if(item){
  const type=CITY_TYPES[item.type],cost=item.level*100;
  panel.innerHTML='<h3>'+type.icon+' '+type.name+' · уровень '+item.level+'/5</h3><p>Участок №'+(citySelected+1)+'. Улучшай здания и развивай свой город.</p><button class="city-action" '+(item.level>=5||coins<cost?'disabled':'')+' onclick="cityUpgrade()">'+(item.level>=5?'Максимальный уровень':'Улучшить · '+cost+' 🪙')+'</button>';
 }else{
  panel.innerHTML='<h3>Свободный участок №'+(citySelected+1)+'</h3><p>Выбери сооружение для строительства:</p><div class="city-buildings">'+CITY_TYPES.map((b,i)=>'<button class="city-action" '+(coins<b.price?'disabled':'')+' onclick="cityBuild('+i+')">'+b.icon+' '+b.name+'<div>'+b.price+' 🪙</div></button>').join("")+'</div>';
 }
}

</script>
