
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8e9e8">
<title>Цветочная история</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: #76565b;
  background: #f7e5e2;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 500px;
  min-height: 100dvh;
  margin: auto;
  padding: 15px 15px 110px;
  background: linear-gradient(180deg,#f8e5e4,#fff3e7);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.player {
  background: linear-gradient(145deg,#fff,#fff1e9);
  padding: 9px 13px;
  border-radius: 18px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-weight: 800;
  font-size: 13px;
}

.money {
  display: flex;
  gap: 7px;
}

.money-item {
  background: #fff;
  padding: 9px 11px;
  border-radius: 16px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-size: 13px;
  font-weight: 800;
}

.logo {
  text-align: center;
  margin: 20px 0 17px;
}

.logo h1 {
  font-family: Georgia,serif;
  font-size: 30px;
  color: #bc7381;
  margin: 0;
  text-shadow: 1px 2px #fff;
}

.logo p {
  color: #a98982;
  font-size: 12px;
  margin: 6px 0 0;
  letter-spacing: 1px;
}

.shop {
  position: relative;
  height: 375px;
  border: 6px solid #fff9ee;
  border-radius: 29px;
  overflow: hidden;
  background: linear-gradient(160deg,#f9d8d0,#f8e6ce 55%,#dce8d0);
  box-shadow: 0 8px 0 #e3c3b9, 0 13px 25px #b98c7b22;
}

.shop::before {
  content: "✿";
  position: absolute;
  left: 15px;
  top: 60px;
  color: #fff8e9;
  font-size: 50px;
  opacity: .6;
}

.shop::after {
  content: "✿";
  position: absolute;
  right: 10px;
  top: 95px;
  color: #fff8e9;
  font-size: 42px;
  opacity: .6;
}

.sign {
  position: absolute;
  z-index: 2;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: linear-gradient(#fffaf0,#fce7d8);
  border: 3px solid #e7b7a8;
  border-radius: 19px;
  padding: 10px 20px;
  color: #a66c71;
  font-family: Georgia,serif;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 4px 0 #d5a393;
}

.window {
  position: absolute;
  top: 83px;
  left: 7%;
  width: 86%;
  height: 185px;
  border: 8px solid #d9a58f;
  border-radius: 21px;
  background: linear-gradient(180deg,#fff9eb,#f9e7d8);
  box-shadow: inset 0 0 0 3px #fff;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}

.flower {
  font-size: 53px;
  filter: drop-shadow(0 5px 3px #9b756633);
  animation: sway 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: .5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes sway {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.shelf {
  position: absolute;
  top: 218px;
  left: 9%;
  width: 82%;
  height: 13px;
  background: #c58c77;
  border-radius: 8px;
}

.counter {
  position: absolute;
  bottom: 45px;
  left: 12%;
  width: 76%;
  height: 54px;
  background: linear-gradient(#d7a18b,#bb806f);
  border: 5px solid #f4d6bd;
  border-radius: 16px;
  box-shadow: 0 7px 0 #a96e63;
}

.counter::before {
  content: "🌷  💐  🌼  🌹";
  position: absolute;
  width: 100%;
  text-align: center;
  top: -38px;
  font-size: 26px;
}

.plant {
  position: absolute;
  left: 10px;
  bottom: 12px;
  font-size: 49px;
}

.cat {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 57px;
  filter: drop-shadow(0 4px 2px #795c4b44);
  animation: catmove 3s ease-in-out infinite;
}

@keyframes catmove {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.heart {
  position: absolute;
  right: 28px;
  top: 66px;
  font-size: 20px;
  animation: heart 2s infinite;
}

@keyframes heart {
  50% { transform: scale(1.3); }
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 22px 0;
}

.big-button {
  min-height: 66px;
  border-radius: 20px;
  background: linear-gradient(145deg,#fff,#fff0e9);
  color: #98666d;
  box-shadow: 0 6px 0 #e4c5bd, 0 8px 15px #b98c7b20;
  font-weight: 800;
  font-size: 14px;
  transition: .15s;
}

.big-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #e4c5bd;
}

.big-button span {
  font-size: 24px;
  display: block;
  margin-bottom: 3px;
}

.heading {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 21px;
  margin: 23px 0 12px;
}

.daily {
  background: linear-gradient(130deg,#fffaf0,#ffe9e3);
  border: 2px solid #fff;
  border-radius: 22px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 5px 0 #e9d0c5;
}

.gift {
  font-size: 40px;
}

.daily-info {
  flex: 1;
}

.daily-info b {
  font-size: 14px;
}

.daily-info p {
  font-size: 11px;
  color: #ad8b83;
  margin: 5px 0 0;
}

.claim {
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  border-radius: 14px;
  padding: 11px 13px;
  font-weight: 800;
  box-shadow: 0 4px 0 #c87583;
}

.claim:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #c87583;
}

.navigation {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #fffaf3;
  padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
  box-shadow: 0 -5px 20px #9e777522;
}

.nav-button {
  background: transparent;
  color: #a98a83;
  font-size: 11px;
  font-weight: bold;
  border-radius: 16px;
  padding: 7px 1px;
}

.nav-button span {
  display: block;
  font-size: 25px;
  margin-bottom: 4px;
}

.nav-button.active {
  color: #c46f80;
  background: #fbe6e5;
}

.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  display: none;
  width: max-content;
  max-width: 90%;
  background: #805c65;
  color: white;
  padding: 13px 18px;
  border-radius: 17px;
  font-size: 13px;
  text-align: center;
  box-shadow: 0 5px 15px #0002;
}

/* Игровые окна */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #65464c88;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 420px;
  max-height: 80dvh;
  overflow-y: auto;
  background: linear-gradient(145deg,#fffaf1,#fce7e4);
  border: 4px solid white;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 8px 25px #53343b44;
}

.modal-title {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 24px;
  text-align: center;
  margin-bottom: 15px;
}

.game-item {
  background: white;
  border-radius: 17px;
  padding: 14px;
  margin: 10px 0;
  box-shadow: 0 4px 0 #ead2c9;
}

.game-item p {
  font-size: 13px;
  color: #a7837e;
}

.game-action {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  font-weight: bold;
  border-radius: 14px;
  box-shadow: 0 4px 0 #c87583;
}

.close-modal {
  display: block;
  margin: 15px auto 0;
  padding: 10px 25px;
  border-radius: 14px;
  background: #f1ded7;
  color: #805c65;
  font-weight: bold;
}

/* Иллюстрированный главный экран — обновление оформления */
body{background:radial-gradient(circle at 20% 5%,#fff4e8,#f3d7da 55%,#e8c8ce);font-family:Trebuchet MS,-apple-system,Arial,sans-serif}

/* Responsive mobile layout: preserve artwork proportions and gameplay */

  background-color:#f5dce3;
  background-image:url("./%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD.png");

}

/* App-like touch behavior: lock the scene, allow scrolling inside dialogs. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}

.app{height:100dvh;min-height:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
.navigation{touch-action:manipulation}
button{touch-action:manipulation}
.modal{overscroll-behavior:contain;touch-action:none}
.modal-card{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}


/* Lock the main scene in place on touch devices (no page dragging/bounce). */

.modal{overscroll-behavior:contain;touch-action:none}
.modal-card{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}

@media(max-width:350px){.daily{width:112px;top:116px}.daily .gift{width:32px}}

/* Weekly gift: icon-only button and scrollable weekly calendar */
.daily.gift-trigger{position:absolute !important;top:clamp(120px,30vw,155px);right:clamp(8px,2vw,14px);z-index:7;display:block;width:clamp(58px,16vw,76px) !important;height:clamp(58px,16vw,76px);min-width:0;padding:0 !important;background:transparent !important;border:0 !important;box-shadow:none !important;border-radius:0 !important;cursor:pointer}
.daily.gift-trigger .gift{display:block;width:100% !important;height:100% !important;object-fit:contain}
.daily.gift-trigger:active{transform:scale(.94)}
@media(max-width:350px){.daily.gift-trigger{top:116px;width:56px !important;height:56px}}
.weekly-hint{text-align:center;font-size:12px;line-height:1.45;margin:0 0 12px;color:#98717a}
.weekly-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.weekly-day{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 5px;border-radius:16px;background:#fff9f4;border:2px solid #f2d9d5;text-align:center;font-size:12px}
.weekly-day.weekly-today{border-color:#d97d9a;background:#fff0f3}
.weekly-day strong{color:#a75c75}.weekly-day small{font-weight:400}
.weekly-day img{width:43px;height:43px;object-fit:contain}
.weekly-claim{width:100%;min-height:32px;padding:5px 2px;border-radius:10px;background:#dd8fa5;color:white;font-size:11px;font-weight:700}
.weekly-claim:disabled{background:#e5d5d7;color:#8b7880;cursor:default}

/* Gift icon: slightly higher, with a matching pastel button backing */
.daily.gift-trigger{
 top:clamp(103px,26vw,137px) !important;
 background:linear-gradient(145deg,#fffaf4,#f7d8dd) !important;
 border:2px solid #fffaf2 !important;
 border-radius:18px !important;
 box-shadow:0 4px 0 #d8a7ae,0 6px 12px #9d697026 !important;
 padding:5px !important;
}
.daily.gift-trigger .gift{width:100% !important;height:100% !important;object-fit:contain}
@media(max-width:350px){.daily.gift-trigger{top:100px !important}}

/* Gift button directly beneath the diamond counter */
.daily.gift-trigger{top:clamp(58px,14vw,75px) !important;right:clamp(8px,2vw,14px) !important}
@media(max-width:350px){.daily.gift-trigger{top:58px !important}}
</style>
</head>

<body>
<div id="portraitGuard" role="status" aria-live="polite">Поверни телефон вертикально, чтобы продолжить игру</div>
<div class="app">

  <div class="top">
    <div class="player">⭐ Уровень 1</div>
    <div class="money">
      <div class="money-item"><img class="currency-icon" src="./%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png" alt="Монеты"> <span id="coins">250</span></div>
      <div class="money-item"><img class="currency-icon" src="./%D0%B0%D0%BB%D0%BC%D0%B0%D0%B7.png" alt="Алмазы"> <span>15</span></div>
    </div>
  </div>

  <div class="logo">
    <img class="game-title-art" src="./%D1%86%D0%B2%D0%B5%D1%82%D0%BE%D1%87%D0%BD%D0%B0%D1%8F%20%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F%20%D0%B3%D0%BB%D0%B0%D0%B2%20%D0%BC%D0%B5%D0%BD%D1%8E.png" alt="Цветочная история">
    
  </div>

  <div class="shop">
    <div class="awning" aria-hidden="true"></div>
    <div class="sign">🌷 Цветочная лавка 🌷</div>
    <div class="window">
      <div class="flower">🌹</div>
      <div class="flower">🌻</div>
      <div class="flower">🌷</div>
    </div>
    <div class="shelf"></div>
    <div class="counter"></div>
    <div class="plant">🪴</div>
    <img class="cat" src="cat.png" alt="Спящий котик">
    <div class="heart">💗</div>
  </div>

  <div class="buttons">
    <button class="big-button" onclick="openPanel('achievements')">
      <span>🏆</span>Достижения
    </button>
    <button class="big-button" onclick="openPanel('events')">
      <span>🎀</span>События
    </button>
  </div>

  

  <button class="daily gift-trigger" onclick="openWeeklyGifts()" aria-label="Открыть подарки на неделю"><img class="gift" src="./%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA.png" alt="Подарки недели"></button>

</div>

<nav class="navigation">
  <button class="nav-button active" onclick="tab(this,'Лавка')">
    <span>🏡</span>Лавка
  </button>
  <button class="nav-button" onclick="tab(this,'Букеты')">
    <span>💐</span>Букеты
  </button>
  <button class="nav-button" onclick="tab(this,'Мини-игры')">
    <span>🎮</span>Мини-игры
  </button>
  <button class="nav-button" onclick="tab(this,'Украшения')">
    <span>🎀</span>Украшения
  </button>
</nav>

<div class="toast" id="toast"></div>

<div class="modal" id="gameModal">
  <div class="modal-card">
    <div id="modalContent"></div>
    <button class="close-modal" onclick="closePanel()">Закрыть</button>
  </div>
</div>

<script>
let coins = Number(localStorage.getItem("flowerCoins")) || 250;
let today = new Date().toDateString();
let giftTaken = localStorage.getItem("flowerGiftTaken") === today;

let decorations = JSON.parse(
  localStorage.getItem("flowerDecorations") || "[]"
);

let bouquetCount = Number(
  localStorage.getItem("flowerBouquets") || 0
);

document.getElementById("coins").textContent = coins;

function message(text) {
  let toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 2300);
}

function closePanel() {
  document.getElementById("gameModal").classList.remove("show");
}

function openPanel(name) {
  const modal = document.getElementById("gameModal");
  const content = document.getElementById("modalContent");

  const screens = {
    achievements: `
      <div class="modal-title">🏆 Достижения</div>
      <div class="game-item">
        🌷 Первые шаги
        <p>Добро пожаловать в свою цветочную лавку!</p>
      </div>
      <div class="game-item">
        💐 Начинающий флорист
        <p>Создано букетов: ${bouquetCount}</p>
      </div>
      <div class="game-item">
        🎀 Коллекционер
        <p>Куплено украшений: ${decorations.length}</p>
      </div>
      <div class="game-item">
        <img class="currency-icon" src="./%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png" alt=""> Копилка
        <p>Сейчас у тебя ${coins} монет</p>
      </div>
    `,

    events: `
      <div class="modal-title">🎀 События</div>
      <div class="game-item">
        🌸 Цветочная неделя
        <p>Создавай букеты и украшай свою лавку!</p>
        <b>Награда: 100 монет</b>
        <button class="game-action" onclick="eventReward()">
          Получить награду
        </button>
      </div>
      <div class="game-item">
        🐈 День котика
        <p>Скоро в твоей лавке появится особое событие.</p>
      </div>
    `,

    bouquets: `
      <div class="modal-title">💐 Мастерская букетов</div>
      <div class="game-item">
        🌹 Розовый букет
        <p>Собери красивый букет из трёх цветов.</p>
        <button class="game-action" onclick="makeBouquet()">
          🌷 Собрать букет
        </button>
      </div>
      <div class="game-item">
        Всего создано букетов: ${bouquetCount}
      </div>
    `,

    games: `
      <div class="modal-title">🎮 Мини-игры</div>
      <div class="game-item">
        🌼 Цветочная удача
        <p>Нажми кнопку и попробуй получить монеты.</p>
        <button class="game-action" onclick="playFlowerGame()">
          Играть
        </button>
      </div>
      <div class="game-item">
        🐝 Цветочная прогулка
        <p>Собери лепестки и получи награду.</p>
        <button class="game-action" onclick="playWalk()">
          Начать прогулку
        </button>
      </div>
    `,

    decorations: `
      <div class="modal-title">🎀 Украшения</div>
      <div class="game-item">
        🪴 Красивое растение
        <p>Цена: 50 монет</p>
        <button class="game-action" onclick="buyDecoration('Растение',50)">
          Купить
        </button>
      </div>
      <div class="game-item">
        🧶 Мягкий коврик
        <p>Цена: 100 монет</p>
        <button class="game-action" onclick="buyDecoration('Коврик',100)">
          Купить
        </button>
      </div>
      <div class="game-item">
        🪧 Вывеска лавки
        <p>Цена: 150 монет</p>
        <button class="game-action" onclick="buyDecoration('Вывеска',150)">
          Купить
        </button>
      </div>
      <div class="game-item">
        Куплено украшений: ${decorations.length}
      </div>
    `
  };

  content.innerHTML = screens[name] || "";
  modal.classList.add("show");
}

function tab(button, name) {
  document.querySelectorAll(".nav-button").forEach(item => {
    item.classList.remove("active");
  });

  button.classList.add("active");

  const pages = {
    "Лавка": null,
    "Букеты": "bouquets",
    "Мини-игры": "games",
    "Украшения": "decorations"
  };

  if (pages[name] === null) {
    closePanel();
  } else {
    openPanel(pages[name]);
  }
}

function updateCoins() {
  document.getElementById("coins").textContent = coins;
  localStorage.setItem("flowerCoins", coins);
}

function localDateKey(date) {
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+d;
}
function openWeeklyGifts() {
  const now=new Date();
  const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
  const claimed=JSON.parse(localStorage.getItem("flowerWeeklyGifts")||"{}");
  const oldClaim=localStorage.getItem("flowerGiftTaken")===now.toDateString();
  const names=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  let cards="";
  for(let i=0;i<7;i++){
    const date=new Date(monday);date.setDate(monday.getDate()+i);
    const key=localDateKey(date),isToday=key===localDateKey(now);
    const isClaimed=!!claimed[key]||(isToday&&oldClaim);
    const isFuture=date>now&&!isToday;
    const label=isClaimed?"Получено":isToday?"Забрать +50":"Недоступно";
    cards+=`<div class="weekly-day ${isToday?"weekly-today":""}">
      <strong>${names[i]} <small>${date.getDate()}.${String(date.getMonth()+1).padStart(2,"0")}</small></strong>
      <img src="./%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA.png" alt="">
      <span>50 монет</span>
      <button class="weekly-claim" ${isToday&&!isClaimed?'onclick="gift()"':"disabled"}>${label}</button>
    </div>`;
  }
  document.getElementById("modalContent").innerHTML='<div class="modal-title">Подарки этой недели</div><p class="weekly-hint">Каждый день — 50 монет. Пропущенные дни нельзя забрать позже.</p><div class="weekly-grid">'+cards+'</div>';
  document.getElementById("gameModal").classList.add("show");
}
function gift() {
  if (giftTaken) {
    message("Ты уже забрала подарок сегодня! 💗");
    return;
  }

  coins += 50;
  giftTaken = true;

  localStorage.setItem("flowerGiftTaken", today);
  const claimed=JSON.parse(localStorage.getItem("flowerWeeklyGifts")||"{}");
  claimed[localDateKey(new Date())]=true;
  localStorage.setItem("flowerWeeklyGifts",JSON.stringify(claimed));
  updateCoins();
  openWeeklyGifts();
  message("Получено 50 монет! ✨");
}

function makeBouquet() {
  bouquetCount++;
  localStorage.setItem("flowerBouquets", bouquetCount);
  message("Ты создала новый букет! 💐");
  openPanel("bouquets");
}

function playFlowerGame() {
  const reward = Math.floor(Math.random() * 21) + 10;
  coins += reward;
  updateCoins();
  message("Ты выиграла " + reward + " монет! 🌸");
}

function playWalk() {
  coins += 15;
  updateCoins();
  message("Ты собрала лепестки и получила 15 монет! 🌼");
}

function buyDecoration(name, price) {
  if (decorations.includes(name)) {
    message("Это украшение уже куплено!");
    return;
  }

  if (coins < price) {
    message("Пока не хватает монет!");
    return;
  }

  coins -= price;
  decorations.push(name);

  localStorage.setItem(
    "flowerDecorations",
    JSON.stringify(decorations)
  );

  updateCoins();
  message("Куплено: " + name + "! 🎀");
  openPanel("decorations");
}

function eventReward() {
  if (localStorage.getItem("flowerEventReward")) {
    message("Ты уже получила эту награду!");
    return;
  }

  coins += 100;
  localStorage.setItem("flowerEventReward", "yes");
  updateCoins();
  message("Получено 100 монет! 🎉");
  openPanel("events");
}

document.getElementById("gameModal").addEventListener("click", function(event) {
  if (event.target === this) closePanel();
});
</script>

</body>
</html>
