
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8e9e8">
<title>Цветочная история</title>

<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: #76565b;
  background: #f7e5e2;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 500px;
  min-height: 100dvh;
  margin: auto;
  padding: 15px 15px 110px;
  background:
    radial-gradient(ellipse at 10% 20%, #fff9e8 0 5%, transparent 6%),
    linear-gradient(180deg, #f8e5e4, #fff3e7);
}

/* Верхняя панель */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.player {
  background: linear-gradient(145deg,#fff,#fff1e9);
  padding: 9px 13px;
  border-radius: 18px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-weight: 800;
  font-size: 13px;
}

.money {
  display: flex;
  gap: 7px;
}

.money-item {
  background: #fff;
  padding: 9px 11px;
  border-radius: 16px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-size: 13px;
  font-weight: 800;
}

/* Заголовок */

.logo {
  text-align: center;
  margin: 20px 0 17px;
}

.logo h1 {
  font-family: Georgia,serif;
  font-size: 30px;
  color: #bc7381;
  margin: 0;
  text-shadow: 1px 2px #fff;
}

.logo p {
  color: #a98982;
  font-size: 12px;
  margin: 6px 0 0;
  letter-spacing: 1px;
}

/* Цветочная лавка */

.shop {
  position: relative;
  height: 375px;
  border: 6px solid #fff9ee;
  border-radius: 29px;
  overflow: hidden;
  background: linear-gradient(160deg,#f9d8d0,#f8e6ce 55%,#dce8d0);
  box-shadow: 0 8px 0 #e3c3b9, 0 13px 25px #b98c7b22;
}

.shop::before {
  content: "✿";
  position: absolute;
  left: 15px;
  top: 60px;
  color: #fff8e9;
  font-size: 50px;
  opacity: .6;
}

.shop::after {
  content: "✿";
  position: absolute;
  right: 10px;
  top: 95px;
  color: #fff8e9;
  font-size: 42px;
  opacity: .6;
}

.sign {
  position: absolute;
  z-index: 2;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: linear-gradient(#fffaf0,#fce7d8);
  border: 3px solid #e7b7a8;
  border-radius: 19px;
  padding: 10px 20px;
  color: #a66c71;
  font-family: Georgia,serif;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 4px 0 #d5a393;
}

.window {
  position: absolute;
  top: 83px;
  left: 7%;
  width: 86%;
  height: 185px;
  border: 8px solid #d9a58f;
  border-radius: 21px;
  background: linear-gradient(180deg,#fff9eb,#f9e7d8);
  box-shadow: inset 0 0 0 3px #fff;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}

.flower {
  font-size: 53px;
  filter: drop-shadow(0 5px 3px #9b756633);
  animation: sway 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: .5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes sway {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.shelf {
  position: absolute;
  top: 218px;
  left: 9%;
  width: 82%;
  height: 13px;
  background: #c58c77;
  border-radius: 8px;
}

.counter {
  position: absolute;
  bottom: 45px;
  left: 12%;
  width: 76%;
  height: 54px;
  background: linear-gradient(#d7a18b,#bb806f);
  border: 5px solid #f4d6bd;
  border-radius: 16px;
  box-shadow: 0 7px 0 #a96e63;
}

.counter::before {
  content: "🌷  💐  🌼  🌹";
  position: absolute;
  width: 100%;
  text-align: center;
  top: -38px;
  font-size: 26px;
}

.plant {
  position: absolute;
  left: 10px;
  bottom: 12px;
  font-size: 49px;
}

.cat {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 57px;
  filter: drop-shadow(0 4px 2px #795c4b44);
  animation: catmove 3s ease-in-out infinite;
}

@keyframes catmove {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.heart {
  position: absolute;
  right: 28px;
  top: 66px;
  font-size: 20px;
  animation: heart 2s infinite;
}

@keyframes heart {
  50% { transform: scale(1.3); }
}

/* Кнопки */

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 22px 0;
}

.big-button {
  min-height: 66px;
  border-radius: 20px;
  background: linear-gradient(145deg,#fff,#fff0e9);
  color: #98666d;
  box-shadow: 0 6px 0 #e4c5bd, 0 8px 15px #b98c7b20;
  font-weight: 800;
  font-size: 14px;
  transition: .15s;
}

.big-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #e4c5bd;
}

.big-button span {
  font-size: 24px;
  display: block;
  margin-bottom: 3px;
}

/* Задание дня */

.heading {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 21px;
  margin: 23px 0 12px;
}

.daily {
  background: linear-gradient(130deg,#fffaf0,#ffe9e3);
  border: 2px solid #fff;
  border-radius: 22px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 5px 0 #e9d0c5;
}

.gift {
  font-size: 40px;
}

.daily-info {
  flex: 1;
}

.daily-info b {
  font-size: 14px;
}

.daily-info p {
  font-size: 11px;
  color: #ad8b83;
  margin: 5px 0 0;
}

.claim {
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  border-radius: 14px;
  padding: 11px 13px;
  font-weight: 800;
  box-shadow: 0 4px 0 #c87583;
}

.claim:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #c87583;
}

/* Нижнее меню */

.navigation {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #fffaf3;
  padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
  box-shadow: 0 -5px 20px #9e777522;
}

.nav-button {
  background: transparent;
  color: #a98a83;
  font-size: 11px;
  font-weight: bold;
  border-radius: 16px;
  padding: 7px 1px;
}

.nav-button span {
  display: block;
  font-size: 25px;
  margin-bottom: 4px;
}

.nav-button.active {
  color: #c46f80;
  background: #fbe6e5;
}

.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  display: none;
  width: max-content;
  max-width: 90%;
  background: #805c65;
  color: white;
  padding: 13px 18px;
  border-radius: 17px;
  font-size: 13px;
  text-align: center;
  box-shadow: 0 5px 15px #0002;
}
</style>
</head>

<body>
<div class="app">

  <div class="top">
    <div class="player">⭐ Уровень 1</div>
    <div class="money">
      <div class="money-item">🪙 <span id="coins">250</span></div>
      <div class="money-item">💎 15</div>
    </div>
  </div>

  <div class="logo">
    <h1>Цветочная история</h1>
    <p>ТВОЯ МАЛЕНЬКАЯ ЦВЕТОЧНАЯ МЕЧТА</p>
  </div>

  <div class="shop">
    <div class="sign">🌷 Цветочная лавка 🌷</div>

    <div class="window">
      <div class="flower">🌹</div>
      <div class="flower">🌻</div>
      <div class="flower">🌷</div>
    </div>

    <div class="shelf"></div>
    <div class="counter"></div>
    <div class="plant">🪴</div>
    <div class="cat">🐈</div>
    <div class="heart">💗</div>
  </div>

  <div class="buttons">
    <button class="big-button" onclick="message('Твои достижения скоро появятся здесь!')">
      <span>🏆</span>Достижения
    </button>
    <button class="big-button" onclick="message('Скоро начнутся новые события!')">
      <span>🎀</span>События
    </button>
  </div>

  <div class="heading">🌸 Подарок для тебя</div>

  <div class="daily">
    <div class="gift">🎁</div>
    <div class="daily-info">
      <b>Ежедневный подарок</b>
      <p>Забери 50 монет для своей лавки!</p>
    </div>
    <button class="claim" onclick="gift()">Забрать</button>
  </div>

</div>

<nav class="navigation">
  <button class="nav-button active" onclick="tab(this,'Лавка')">
    <span>🏡</span>Лавка
  </button>
  <button class="nav-button" onclick="tab(this,'Букеты')">
    <span>💐</span>Букеты
  </button>
  <button class="nav-button" onclick="tab(this,'Мини-игры')">
    <span>🎮</span>Мини-игры
  </button>
  <button class="nav-button" onclick="tab(this,'Украшения')">
    <span>🎀</span>Украшения
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
let coins = Number(localStorage.getItem("flowerCoins")) || 250;
let today = new Date().toDateString();
let giftTaken = localStorage.getItem("flowerGiftTaken") === today;

document.getElementById("coins").textContent = coins;

function message(text) {
  let toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 2300);
}

function tab(button, name) {
  document.querySelectorAll(".nav-button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");

  if (name === "Лавка") {
    message("Добро пожаловать в свою лавку! 🌷");
  } else {
    message("Раздел «" + name + "» скоро откроется!");
  }
}

function gift() {
  if (giftTaken) {
    message("Ты уже забрала подарок сегодня! 💗");
    return;
  }

  coins += 50;
  giftTaken = true;

  localStorage.setItem("flowerCoins", coins);
  localStorage.setItem("flowerGiftTaken", today);

  document.getElementById("coins").textContent = coins;
  message("Получено 50 монет! ✨");
}
</script>

</body>
</html>
