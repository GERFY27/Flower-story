
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8e9e8">
<title>Цветочная история</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="./%D0%B8%D0%BA%D0%BE%D0%BD%D0%BA%D0%B0%20%D0%BD%D0%B0%20%D1%80%D0%B0%D0%B1%D0%BE%D1%87%D0%B5%D0%BC%20%D1%81%D1%82%D0%BE%D0%BB%D0%B5.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: #76565b;
  background: #f7e5e2;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 500px;
  min-height: 100dvh;
  margin: auto;
  padding: 15px 15px 110px;
  background: linear-gradient(180deg,#f8e5e4,#fff3e7);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.player {
  background: linear-gradient(145deg,#fff,#fff1e9);
  padding: 9px 13px;
  border-radius: 18px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-weight: 800;
  font-size: 13px;
}

.money {
  display: flex;
  gap: 7px;
}

.money-item {
  background: #fff;
  padding: 9px 11px;
  border-radius: 16px;
  box-shadow: 0 4px 0 #e8c8c3;
  font-size: 13px;
  font-weight: 800;
}

.logo {
  text-align: center;
  margin: 20px 0 17px;
}

.logo h1 {
  font-family: Georgia,serif;
  font-size: 30px;
  color: #bc7381;
  margin: 0;
  text-shadow: 1px 2px #fff;
}

.logo p {
  color: #a98982;
  font-size: 12px;
  margin: 6px 0 0;
  letter-spacing: 1px;
}

.shop {
  position: relative;
  height: 375px;
  border: 6px solid #fff9ee;
  border-radius: 29px;
  overflow: hidden;
  background: linear-gradient(160deg,#f9d8d0,#f8e6ce 55%,#dce8d0);
  box-shadow: 0 8px 0 #e3c3b9, 0 13px 25px #b98c7b22;
}

.shop::before {
  content: "✿";
  position: absolute;
  left: 15px;
  top: 60px;
  color: #fff8e9;
  font-size: 50px;
  opacity: .6;
}

.shop::after {
  content: "✿";
  position: absolute;
  right: 10px;
  top: 95px;
  color: #fff8e9;
  font-size: 42px;
  opacity: .6;
}

.sign {
  position: absolute;
  z-index: 2;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: linear-gradient(#fffaf0,#fce7d8);
  border: 3px solid #e7b7a8;
  border-radius: 19px;
  padding: 10px 20px;
  color: #a66c71;
  font-family: Georgia,serif;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 4px 0 #d5a393;
}

.window {
  position: absolute;
  top: 83px;
  left: 7%;
  width: 86%;
  height: 185px;
  border: 8px solid #d9a58f;
  border-radius: 21px;
  background: linear-gradient(180deg,#fff9eb,#f9e7d8);
  box-shadow: inset 0 0 0 3px #fff;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}

.flower {
  font-size: 53px;
  filter: drop-shadow(0 5px 3px #9b756633);
  animation: sway 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: .5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes sway {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.shelf {
  position: absolute;
  top: 218px;
  left: 9%;
  width: 82%;
  height: 13px;
  background: #c58c77;
  border-radius: 8px;
}

.counter {
  position: absolute;
  bottom: 45px;
  left: 12%;
  width: 76%;
  height: 54px;
  background: linear-gradient(#d7a18b,#bb806f);
  border: 5px solid #f4d6bd;
  border-radius: 16px;
  box-shadow: 0 7px 0 #a96e63;
}

.counter::before {
  content: "🌷  💐  🌼  🌹";
  position: absolute;
  width: 100%;
  text-align: center;
  top: -38px;
  font-size: 26px;
}

.plant {
  position: absolute;
  left: 10px;
  bottom: 12px;
  font-size: 49px;
}

.cat {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 57px;
  filter: drop-shadow(0 4px 2px #795c4b44);
  animation: catmove 3s ease-in-out infinite;
}

@keyframes catmove {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.heart {
  position: absolute;
  right: 28px;
  top: 66px;
  font-size: 20px;
  animation: heart 2s infinite;
}

@keyframes heart {
  50% { transform: scale(1.3); }
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 22px 0;
}

.big-button {
  min-height: 66px;
  border-radius: 20px;
  background: linear-gradient(145deg,#fff,#fff0e9);
  color: #98666d;
  box-shadow: 0 6px 0 #e4c5bd, 0 8px 15px #b98c7b20;
  font-weight: 800;
  font-size: 14px;
  transition: .15s;
}

.big-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #e4c5bd;
}

.big-button span {
  font-size: 24px;
  display: block;
  margin-bottom: 3px;
}

.heading {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 21px;
  margin: 23px 0 12px;
}

.daily {
  background: linear-gradient(130deg,#fffaf0,#ffe9e3);
  border: 2px solid #fff;
  border-radius: 22px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 5px 0 #e9d0c5;
}

.gift {
  font-size: 40px;
}

.daily-info {
  flex: 1;
}

.daily-info b {
  font-size: 14px;
}

.daily-info p {
  font-size: 11px;
  color: #ad8b83;
  margin: 5px 0 0;
}

.claim {
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  border-radius: 14px;
  padding: 11px 13px;
  font-weight: 800;
  box-shadow: 0 4px 0 #c87583;
}

.claim:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #c87583;
}

.navigation {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #fffaf3;
  padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
  box-shadow: 0 -5px 20px #9e777522;
}

.nav-button {
  background: transparent;
  color: #a98a83;
  font-size: 11px;
  font-weight: bold;
  border-radius: 16px;
  padding: 7px 1px;
}

.nav-button span {
  display: block;
  font-size: 25px;
  margin-bottom: 4px;
}

.nav-button.active {
  color: #c46f80;
  background: #fbe6e5;
}

.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  display: none;
  width: max-content;
  max-width: 90%;
  background: #805c65;
  color: white;
  padding: 13px 18px;
  border-radius: 17px;
  font-size: 13px;
  text-align: center;
  box-shadow: 0 5px 15px #0002;
}

/* Игровые окна */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #65464c88;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 420px;
  max-height: 80dvh;
  overflow-y: auto;
  background: linear-gradient(145deg,#fffaf1,#fce7e4);
  border: 4px solid white;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 8px 25px #53343b44;
}

.modal-title {
  font-family: Georgia,serif;
  color: #b66e7c;
  font-size: 24px;
  text-align: center;
  margin-bottom: 15px;
}

.game-item {
  background: white;
  border-radius: 17px;
  padding: 14px;
  margin: 10px 0;
  box-shadow: 0 4px 0 #ead2c9;
}

.game-item p {
  font-size: 13px;
  color: #a7837e;
}

.game-action {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  background: linear-gradient(#f4b0b2,#df8999);
  color: white;
  font-weight: bold;
  border-radius: 14px;
  box-shadow: 0 4px 0 #c87583;
}

.close-modal {
  display: block;
  margin: 15px auto 0;
  padding: 10px 25px;
  border-radius: 14px;
  background: #f1ded7;
  color: #805c65;
  font-weight: bold;
}

/* Иллюстрированный главный экран — обновление оформления */
body{background:radial-gradient(circle at 20% 5%,#fff4e8,#f3d7da 55%,#e8c8ce);font-family:Trebuchet MS,-apple-system,Arial,sans-serif}
.app{max-width:520px;background:linear-gradient(180deg,#f8e1e6 0%,#fff0e5 45%,#f7e2d5 100%);box-shadow:0 0 50px #a86c7830;position:relative;overflow:hidden}
.app:before{content:"✿  ✧  ✿";position:absolute;top:72px;left:0;width:100%;text-align:center;font-size:32px;letter-spacing:75px;color:#e6b7bf80;pointer-events:none}
.top{position:relative;z-index:2}
.player,.money-item{border:2px solid #fff9f1;background:linear-gradient(#fffaf4,#ffe7e0);box-shadow:0 4px 0 #d7a8a5,0 6px 12px #8b5e5b26;color:#9e6674}
.logo{position:relative;z-index:1;margin:20px 0 14px}
.logo h1{font-size:clamp(28px,7vw,38px);color:#ad647b;text-shadow:0 2px #fff,0 4px 8px #9c6d7c44}
.logo p{font-size:10px;letter-spacing:2px}
.shop{height:400px;border:7px solid #fff8e9;border-radius:30px;background:linear-gradient(#f5d8df 0 38%,#fce4c9 38% 73%,#c5d8b2 73% 100%);box-shadow:0 8px 0 #d5adb0,0 15px 25px #8c64703a}
.shop:before{content:"✿";left:5%;top:24%;font-size:62px;color:#fff5e0}
.shop:after{content:"✿";right:2%;top:18%;font-size:54px;color:#fff5e0}
.shop .sign{top:24px;z-index:5;background:linear-gradient(#fffdf2,#f6e0c9);border:4px solid #d9a28d;box-shadow:0 5px 0 #b87c77;font-size:17px;padding:10px 14px}
.shop .window{top:112px;height:190px;left:12%;width:76%;border:10px solid #b98073;border-radius:17px;background:linear-gradient(125deg,#fdf2d8,#f5d8d0);box-shadow:inset 0 0 0 5px #f9e6d4,0 5px 0 #ab756a}
.shop .window:before{content:"";position:absolute;left:49%;top:0;height:100%;width:9px;background:#bc8879}
.shop .window:after{content:"";position:absolute;top:50%;left:0;width:100%;height:8px;background:#bc8879}
.shop .flower{font-size:clamp(42px,10vw,62px);z-index:1}
.shop .shelf{top:272px;z-index:2;background:#b77d71}
.shop .counter{bottom:33px;height:65px;background:linear-gradient(#e1b29d,#b67d72);border-color:#f6ddc4;z-index:3}
.shop .plant{z-index:4;font-size:60px;bottom:15px}
.shop .cat{z-index:5;font-size:64px;bottom:12px}
.shop .heart{z-index:5}
.shop .awning{position:absolute;top:82px;left:5%;width:90%;height:55px;z-index:4;border-radius:12px 12px 20px 20px;border:4px solid #fff3e8;background:repeating-linear-gradient(90deg,#e9a4ae 0 35px,#fff2e6 35px 70px);box-shadow:0 8px 0 #b87f82,0 11px 10px #8f6a6330;clip-path:polygon(0 0,100% 0,100% 83%,96% 100%,88% 83%,80% 100%,72% 83%,64% 100%,56% 83%,48% 100%,40% 83%,32% 100%,24% 83%,16% 100%,8% 83%,0 100%)}
.buttons{margin:20px 0 12px}
.big-button{border:3px solid #fff8f1;background:linear-gradient(#fce9e4,#efc5c5);box-shadow:0 6px 0 #ce9ca0,0 9px 13px #ad777d35;color:#9e6070;font-size:15px}
.big-button span{font-size:29px}
.heading{text-align:center;margin:18px 0 12px}
.daily{border:3px solid #fffaf0;box-shadow:0 6px 0 #d9b2ae;background:linear-gradient(120deg,#fffaf1,#f8d9d5)}
.claim,.game-action{background:linear-gradient(#efaeb9,#d77d96);box-shadow:0 4px 0 #b8657d;border:2px solid #ffdce0}
.navigation{max-width:520px;background:linear-gradient(#fff9f1,#f9e5df);border-top:3px solid #fff;box-shadow:0 -6px 18px #9d69702a}

.nav-button.active{background:#f6d7df;color:#ad5d78;box-shadow:inset 0 0 0 2px #fff}

/* Фон главного экрана из загруженного файла */
body{background:#f5dce3}
.app{background-image:url("./%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD.png");background-position:center top;background-repeat:no-repeat;background-size:100% 100%;min-height:100dvh}

.shop{background:transparent;border-color:transparent;box-shadow:none}

.shop .cat[src]{right:19% !important;bottom:13% !important;}
.shop .cat[src]{right:29% !important;bottom:13% !important;}
.shop .cat[src]{right:39% !important;bottom:13% !important;}

/* Responsive mobile layout: preserve artwork proportions and gameplay */
html{width:100%;min-height:100%;overflow-x:hidden}
body{width:100%;min-height:100dvh;overflow-x:hidden}
.app{
  width:100%;max-width:520px;min-height:100dvh;
  margin-inline:auto;
  padding:clamp(9px,2.8vw,15px) clamp(9px,2.8vw,15px) calc(112px + env(safe-area-inset-bottom,0px));
  background-color:#f5dce3;
  background-image:url("./%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD.png");
  background-size:100% auto;
  background-position:center top;
  background-repeat:no-repeat;
}
.top{gap:clamp(3px,1.5vw,8px);min-width:0}
.player{font-size:clamp(10px,2.7vw,13px);padding:clamp(6px,1.7vw,9px);white-space:nowrap;flex-shrink:1}
.money{gap:clamp(3px,1.2vw,7px);min-width:0}
.money-item{font-size:clamp(10px,2.7vw,13px);padding:clamp(5px,1.7vw,9px);gap:3px;min-width:0}
.currency-icon{width:clamp(17px,5vw,24px);height:clamp(17px,5vw,24px)}
.logo{margin:clamp(14px,4vw,20px) 0 clamp(12px,3.5vw,17px)}
.logo h1{font-size:clamp(23px,7vw,36px);line-height:1.12}
.logo p{font-size:clamp(8px,2.1vw,11px);letter-spacing:clamp(0px,.2vw,1px)}
.shop{height:auto;aspect-ratio:1.17/1;min-height:0;overflow:visible}
.shop .cat[src]{
  width:clamp(60px,18vw,88px) !important;
  max-width:24% !important;
  height:auto !important;
  right:39% !important;
  bottom:13% !important;
  animation:none !important;
  transform:none !important;
}
.buttons{gap:clamp(7px,2.4vw,12px);margin:clamp(10px,3vw,20px) 0 12px}
.big-button{min-height:clamp(58px,16vw,70px);font-size:clamp(11px,3.2vw,15px);padding:7px 4px}
.big-button span{font-size:clamp(22px,6vw,29px)}
.heading{font-size:clamp(17px,4.5vw,21px);margin:clamp(12px,3vw,18px) 0 10px}
.daily{padding:clamp(9px,2.7vw,14px);gap:clamp(6px,2vw,11px)}
.gift{font-size:clamp(28px,9vw,40px)}
.daily-info{min-width:0}
.daily-info b{font-size:clamp(11px,3vw,14px)}
.daily-info p{font-size:clamp(9px,2.4vw,11px)}
.claim{padding:clamp(8px,2.5vw,11px);font-size:clamp(11px,3vw,14px);flex-shrink:0}
.navigation{width:100%;max-width:520px;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 5px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-button{min-width:0;min-height:52px;font-size:clamp(9px,2.5vw,12px);padding:6px 1px}
.nav-button span{font-size:clamp(21px,6vw,27px)}
.modal{padding:12px}
.modal-card{max-width:min(420px,100%);max-height:calc(100dvh - 40px - env(safe-area-inset-bottom,0px))}
@media(max-width:360px){.app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}.shop{aspect-ratio:1.2/1}.daily{border-width:2px}.claim{padding:8px}}
@media(min-width:521px){.shop .cat[src]{width:88px !important}}
@media(max-height:650px){.modal-card{max-height:85dvh}}


/* Anchor the cat to the artwork, not to the responsive shop spacer. */
.shop{position:static}
.shop .cat[src]{
 position:absolute !important;
 top:calc(min(100vw, 520px) * .88) !important;
 left:43% !important;
 right:auto !important;
 bottom:auto !important;
 width:clamp(60px,18vw,88px) !important;
 max-width:none !important;
 height:auto !important;
 animation:none !important;
 transform:none !important;
 pointer-events:none;
}


/* App-like touch behavior: lock the scene, allow scrolling inside dialogs. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;touch-action:none}
.app{height:100dvh;min-height:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
.navigation{touch-action:manipulation}
button{touch-action:manipulation}
.modal{overscroll-behavior:contain;touch-action:none}
.modal-card{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}


/* Lock the main scene in place on touch devices (no page dragging/bounce). */
html,body{height:100%;height:100dvh;overflow:hidden !important;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;touch-action:none}
.app{height:100dvh;min-height:0 !important;overflow:hidden !important;overscroll-behavior:none;touch-action:none}
.app button,.navigation button{touch-action:manipulation}
.navigation{touch-action:none}
.modal{overscroll-behavior:contain;touch-action:none}
.modal-card{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}


/* Landscape guard: browser orientation cannot be forcibly locked. */
#portraitGuard{display:none;position:fixed;inset:0;z-index:9999;background:#f7e1e8;color:#98566f;align-items:center;justify-content:center;text-align:center;padding:24px;font:700 22px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif}
@media (orientation:landscape) and (pointer:coarse){#portraitGuard{display:flex}}
/* Cat aligned to marked point on the flower shop shelf */
.shop .cat[src]{top:calc(min(100vw, 520px) * .80) !important;left:43% !important;right:auto !important;bottom:auto !important;animation:none !important;transform:none !important;}
.game-title-art{display:block;width:100%;max-width:440px;height:auto;max-height:clamp(58px,18vw,105px);object-fit:contain;margin:0 auto;filter:none}.logo{display:flex;flex-direction:column;align-items:center;gap:2px}.logo p{margin:0}
.game-title-art{width:108% !important;max-width:475px !important;max-height:clamp(66px,20vw,115px) !important;}

<script>
(function(){
  const splash=document.getElementById("flowerSplash");
  const progress=document.getElementById("splashProgress");
  const started=Date.now();
  let completed=false;
  const setProgress=n=>{if(progress)progress.style.width=n+"%";};
  setProgress(12);
  const interval=setInterval(()=>{if(!completed)setProgress(Math.min(88,12+(Date.now()-started)/24));},120);
  function finish(){
    if(completed)return;
    completed=true;
    clearInterval(interval);
    setProgress(100);
    setTimeout(()=>{splash.classList.add("splash-hidden");setTimeout(()=>splash.remove(),750);},300);
  }
  const assets=["./%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D1%8B%D0%B9%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD.png","./cat.png","./%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA.png","./%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png","./%D0%B0%D0%BB%D0%BC%D0%B0%D0%B7.png"];
  const ready=Promise.all(assets.map(src=>new Promise(resolve=>{const img=new Image();img.onload=resolve;img.onerror=resolve;img.src=src;})));
  Promise.all([ready,new Promise(resolve=>setTimeout(resolve,1100))]).then(finish);
  setTimeout(finish,5000);
})();

function localDateKey(date) {
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+d;
}
const GAME_VERSION="0.1.4"; // Change this value when publishing a new game release.
const splashVersionElement=document.getElementById("splashVersion");
if(splashVersionElement)splashVersionElement.textContent="Версия "+GAME_VERSION;
const GAME_DEVELOPER="GERFY27";
let gameSoundEnabled=localStorage.getItem("flowerSoundEnabled")!=="0";
let gameVolume=Math.max(0,Math.min(100,Number(localStorage.getItem("flowerVolume")??"45")||0));
let gameAudioContext=null;
let catPurrCooldown=0;
function petCat(){
  if(Date.now()-catPurrCooldown<1800)return;
  catPurrCooldown=Date.now();
  if(!gameSoundEnabled||gameVolume<=0)return;
  try{
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return;
    if(!gameAudioContext)gameAudioContext=new Context();
    if(gameAudioContext.state==="suspended")gameAudioContext.resume().catch(()=>{});
    const ctx=gameAudioContext,start=ctx.currentTime,duration=2.05;
    const master=ctx.createGain();
    const level=Math.max(.0001,gameVolume/100*.085);
    master.gain.setValueAtTime(.0001,start);
    master.gain.exponentialRampToValueAtTime(level,start+.30);
    master.gain.setValueAtTime(level,start+1.55);
    master.gain.exponentialRampToValueAtTime(.0001,start+duration);
    master.connect(ctx.destination);
    // Rounded, breath-like purr pulses without harsh sawtooth harmonics.
    const breath=ctx.createOscillator(),breathDepth=ctx.createGain(),breathBase=ctx.createConstantSource();
    const pulseGain=ctx.createGain();
    breath.type="sine";breath.frequency.setValueAtTime(22,start);
    breath.frequency.linearRampToValueAtTime(24,start+duration);
    breathDepth.gain.value=.16;
    breathBase.offset.value=.78;
    breath.connect(breathDepth);breathDepth.connect(pulseGain.gain);
    breathBase.connect(pulseGain.gain);
    pulseGain.connect(master);
    const tones=[[94,.72],[141,.15],[188,.07]];
    tones.forEach(([frequency,weight],i)=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type="sine";
      osc.frequency.setValueAtTime(frequency,start);
      osc.frequency.linearRampToValueAtTime(frequency*(i===0?1.025:1.01),start+duration);
      gain.gain.value=weight;
      osc.connect(gain);gain.connect(pulseGain);
      osc.start(start);osc.stop(start+duration+.02);
    });
    breath.start(start);breath.stop(start+duration+.02);
    breathBase.start(start);breathBase.stop(start+duration+.02);
  }catch(e){}
}
function playGameClick(kind="tap"){
  if(!gameSoundEnabled||gameVolume<=0)return;
  try{
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return;
    if(!gameAudioContext)gameAudioContext=new Context();
    if(gameAudioContext.state==="suspended")gameAudioContext.resume().catch(()=>{});
    const now=gameAudioContext.currentTime;
    const notes=kind==="reward"?[659.25,987.77]:kind==="close"?[523.25]:[783.99,1046.5];
    notes.forEach((frequency,index)=>{
      const osc=gameAudioContext.createOscillator();
      const gain=gameAudioContext.createGain();
      const start=now+index*.055;
      const level=Math.max(.0001,(gameVolume/100)*.16);
      osc.type="sine";
      osc.frequency.setValueAtTime(frequency,start);
      osc.frequency.exponentialRampToValueAtTime(frequency*1.035,start+.075);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(level,start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,start+.15);
      osc.connect(gain);gain.connect(gameAudioContext.destination);
      osc.start(start);osc.stop(start+.16);
    });
  }catch(e){}
}
document.addEventListener("pointerdown",event=>{
  const button=event.target.closest("button");
  if(!button||button.disabled||button.id==="soundToggle")return;
  playGameClick(button.classList.contains("close-modal")?"close":button.classList.contains("weekly-claim")?"reward":"tap");
},{passive:true});

/* Original gentle flower-shop lullaby, synthesized locally (no third-party track). */
let gameMusicEnabled=localStorage.getItem("flowerMusicEnabled")!=="0";
let musicTimer=null,musicNextTime=0,musicStep=0,musicGain=null;
const musicMelody=[392,440,523.25,440,392,329.63,349.23,392,440,523.25,587.33,523.25,440,392,349.23,329.63,
  349.23,392,440,392,349.23,293.66,329.63,349.23,392,440,493.88,440,392,349.23,329.63,293.66];
const musicChords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
function ensureMusicAudio(){
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return false;
  if(!gameAudioContext)gameAudioContext=new Context();
  if(!musicGain){
    musicGain=gameAudioContext.createGain();
    musicGain.gain.value=0;
    musicGain.connect(gameAudioContext.destination);
  }
  return true;
}
function musicNote(freq,start,duration,level){
  const ctx=gameAudioContext;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type="sine";osc.frequency.setValueAtTime(freq,start);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level),start+.06);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  osc.connect(gain);gain.connect(musicGain);
  osc.start(start);osc.stop(start+duration+.02);
}
function scheduleMusic(){
  if(!gameMusicEnabled||!gameSoundEnabled||document.hidden||!gameAudioContext||gameAudioContext.state!=="running")return;
  const ctx=gameAudioContext;
  const beat=.46;
  while(musicNextTime<ctx.currentTime+.6){
    const index=musicStep%musicMelody.length;
    const start=musicNextTime;
    musicNote(musicMelody[index],start,.37,.34);
    if(index%8===0){
      const chord=musicChords[Math.floor(index/8)%musicChords.length];
      chord.forEach((freq,i)=>musicNote(freq/2,start,3.2,.07/(i+1)));
    }
    musicNextTime+=beat;
    musicStep++;
  }
}
function updateMusic(){
  const shouldPlay=gameMusicEnabled&&gameSoundEnabled&&gameVolume>0&&!document.hidden;
  if(!shouldPlay){
    if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null;}
    if(musicGain&&gameAudioContext)musicGain.gain.setTargetAtTime(0,gameAudioContext.currentTime,.08);
    return;
  }
  if(!ensureMusicAudio())return;
  if(gameAudioContext.state==="suspended")gameAudioContext.resume().catch(()=>{});
  musicGain.gain.setTargetAtTime((gameVolume/100)*.13,gameAudioContext.currentTime,.2);
  if(musicTimer===null){
    musicNextTime=gameAudioContext.currentTime+.08;
    musicTimer=setInterval(scheduleMusic,180);
    scheduleMusic();
  }
}
function toggleGameMusic(){
  gameMusicEnabled=!gameMusicEnabled;
  localStorage.setItem("flowerMusicEnabled",gameMusicEnabled?"1":"0");
  const button=document.getElementById("musicToggle");
  if(button){button.textContent=gameMusicEnabled?"Включена":"Выключена";button.setAttribute("aria-checked",String(gameMusicEnabled));}
  updateMusic();
}
document.addEventListener("pointerdown",()=>{if(gameMusicEnabled&&gameSoundEnabled)updateMusic();},{once:true,passive:true});
document.addEventListener("visibilitychange",updateMusic);
function openSettings() {
  document.getElementById("modalContent").innerHTML =
    '<div class="modal-title">Настройки</div>'+
    '<div class="settings-section">'+
      '<div class="settings-line"><span>Звук игры</span><button id="soundToggle" class="settings-switch" type="button" role="switch" aria-checked="'+gameSoundEnabled+'" onclick="toggleGameSound()">'+(gameSoundEnabled?'Включён':'Выключен')+'</button></div>'+
      '<div class="settings-line"><span>Фоновая музыка</span><button id="musicToggle" class="settings-switch" type="button" role="switch" aria-checked="'+gameMusicEnabled+'" onclick="toggleGameMusic()">'+(gameMusicEnabled?'Включена':'Выключена')+'</button></div>'+
      '<label class="settings-volume-label" for="gameVolume">Громкость <output id="gameVolumeValue">'+gameVolume+'%</output></label>'+
      '<input id="gameVolume" class="settings-volume" type="range" min="0" max="100" step="1" value="'+gameVolume+'" oninput="setGameVolume(this.value)" aria-label="Громкость игры">'+
      '<button class="game-action" onclick="toggleGameMotion()">Анимация: <span id="motionSettingLabel">'+(localStorage.getItem("flowerReduceMotion")==="1"?'выключена':'включена')+'</span></button>'+
    '</div>'+
    '<div class="settings-footer"><div>Цветочная история</div><div>Версия '+GAME_VERSION+'</div><div>Разработчик: '+GAME_DEVELOPER+'</div></div>';
  document.getElementById("gameModal").classList.add("show");
}
function toggleGameSound(){
  gameSoundEnabled=!gameSoundEnabled;
  localStorage.setItem("flowerSoundEnabled",gameSoundEnabled?"1":"0");
  const btn=document.getElementById("soundToggle");
  if(btn){btn.textContent=gameSoundEnabled?"Включён":"Выключен";btn.setAttribute("aria-checked",String(gameSoundEnabled));}
  if(gameSoundEnabled)playGameClick();
  updateMusic();
}
function setGameVolume(value){
  gameVolume=Math.max(0,Math.min(100,Number(value)||0));
  localStorage.setItem("flowerVolume",String(gameVolume));
  const out=document.getElementById("gameVolumeValue");
  if(out)out.textContent=gameVolume+"%";
  updateMusic();
  if(gameSoundEnabled&&gameVolume>0)playGameClick();
}
function toggleGameMotion(){
  const disabled=localStorage.getItem("flowerReduceMotion")!=="1";
  localStorage.setItem("flowerReduceMotion",disabled?"1":"0");
  document.body.classList.toggle("reduce-game-motion",disabled);
  const label=document.getElementById("motionSettingLabel");
  if(label)label.textContent=disabled?"выключена":"включена";
}
document.body.classList.toggle("reduce-game-motion",localStorage.getItem("flowerReduceMotion")==="1");
function openWeeklyGifts() {
  const now=new Date();
  const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
  const claimed=JSON.parse(localStorage.getItem("flowerWeeklyGifts")||"{}");
  const oldClaim=localStorage.getItem("flowerGiftTaken")===now.toDateString();
  const names=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  let cards="";
  for(let i=0;i<7;i++){
    const date=new Date(monday);date.setDate(monday.getDate()+i);
    const key=localDateKey(date),isToday=key===localDateKey(now);
    const isClaimed=!!claimed[key]||(isToday&&oldClaim);
    const isFuture=date>now&&!isToday;
    const label=isClaimed?"Получено":isToday?"Забрать +50":"Недоступно";
    cards+=`<div class="weekly-day ${isToday?"weekly-today":""}">
      <strong>${names[i]} <small>${date.getDate()}.${String(date.getMonth()+1).padStart(2,"0")}</small></strong>
      <img src="./%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA.png" alt="">
      <span>50 монет</span>
      <button class="weekly-claim" ${isToday&&!isClaimed?'onclick="gift()"':"disabled"}>${label}</button>
    </div>`;
  }
  document.getElementById("modalContent").innerHTML='<div class="modal-title">Подарки этой недели</div><p class="weekly-hint">Каждый день — 50 монет. Пропущенные дни нельзя забрать позже.</p><div class="weekly-grid">'+cards+'</div>';
  document.getElementById("gameModal").classList.add("show");
}
function gift() {
  if (giftTaken) {
    message("Ты уже забрала подарок сегодня! 💗");
    return;
  }

  coins += 50;
  giftTaken = true;

  localStorage.setItem("flowerGiftTaken", today);
  const claimed=JSON.parse(localStorage.getItem("flowerWeeklyGifts")||"{}");
  claimed[localDateKey(new Date())]=true;
  localStorage.setItem("flowerWeeklyGifts",JSON.stringify(claimed));
  updateCoins();
  openWeeklyGifts();
  message("Получено 50 монет! ✨");
}

function makeBouquet() {
  bouquetCount++;
  localStorage.setItem("flowerBouquets", bouquetCount);
  message("Ты создала новый букет! 💐");
  openPanel("bouquets");
}

function playFlowerGame() {
  const reward = Math.floor(Math.random() * 21) + 10;
  coins += reward;
  updateCoins();
  message("Ты выиграла " + reward + " монет! 🌸");
}

function playWalk() {
  coins += 15;
  updateCoins();
  message("Ты собрала лепестки и получила 15 монет! 🌼");
}

function buyDecoration(name, price) {
  if (decorations.includes(name)) {
    message("Это украшение уже куплено!");
    return;
  }

  if (coins < price) {
    message("Пока не хватает монет!");
    return;
  }

  coins -= price;
  decorations.push(name);

  localStorage.setItem(
    "flowerDecorations",
    JSON.stringify(decorations)
  );

  updateCoins();
  message("Куплено: " + name + "! 🎀");
  openPanel("decorations");
}

function eventReward() {
  if (localStorage.getItem("flowerEventReward")) {
    message("Ты уже получила эту награду!");
    return;
  }

  coins += 100;
  localStorage.setItem("flowerEventReward", "yes");
  updateCoins();
  message("Получено 100 монет! 🎉");
  openPanel("events");
}

document.getElementById("gameModal").addEventListener("click", function(event) {
  if (event.target === this) closePanel();
});
